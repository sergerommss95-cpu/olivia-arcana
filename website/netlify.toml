[build]
  command = "npm run build"
  publish = "out"

# Set NEXT_PUBLIC_API_URL in Netlify dashboard (Site → Settings → Environment).
# Default below points at the (not-yet-deployed) production API. Override per
# branch as needed. ANTHROPIC_API_KEY must be set as a secret server-side.
[build.environment]
  NEXT_PUBLIC_API_URL = "https://olivia-api.up.railway.app"
  NODE_VERSION = "22"

[[edge_functions]]
  path = "/api/chat"
  function = "chat"

[[edge_functions]]
  path = "/api/reading"
  function = "reading"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Content-addressed files (hash in the name) never change: cache them for a year.
[[headers]]
  for = "/experience/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Resized card faces (scripts/card-sizes.mjs) keep the masters' unhashed names, so a regenerated
# card must still reach readers: cache for a week, not immutable.
[[headers]]
  for = "/cards/w448/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/cards/w640/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Internal copies: the motion reference and the standalone experience snapshot
# (the homepage renders the same product). Keep them out of search results.
[[headers]]
  for = "/animation/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The Telegram Mini App. Telegram Web shows Mini Apps inside a frame, so these
# pages (and only these) may be framed by web.telegram.org.
[[headers]]
  for = "/tg/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/experience/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The Birth Portrait is in private beta: reachable, never indexed.
[[headers]]
  for = "/portrait/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uk/portrait/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The older chart pages became Olivia Astrology's birth chart (on-device, bilingual).
[[redirects]]
  from = "/chart"
  to = "/astrology/birth-chart/"
  status = 301
  force = true

[[redirects]]
  from = "/chart/*"
  to = "/astrology/birth-chart/"
  status = 301
  force = true
