<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.wrap{display:grid;place-items:center;height:calc(100% - 96px)}
.plate{position:relative;width:600px;height:600px}
.plate svg{position:absolute;inset:0}
.plate text{font:400 15px var(--heading);fill:var(--faint);text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.plate text.on{fill:var(--ink)}.plate text.now{fill:var(--gilt)}
.plate line{stroke:var(--faint);stroke-width:1}.plate line.on,.plate line.now{stroke:var(--gilt)}
.ring{fill:none;stroke:var(--hair)}.arc{fill:none;stroke:var(--gilt);stroke-width:1.2;opacity:.8}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);--w:190px}
.center .card{box-shadow:0 0 0 1px rgba(201,177,130,.4) inset,0 40px 80px rgba(0,0,0,.55)}
.title{position:absolute;top:-6px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.cap{margin-top:6px;text-align:center}
.cap h1{font:italic 400 30px/1.2 var(--heading);color:var(--ink)}
.cap p{font:400 11px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:10px}
.frame{position:absolute;inset:-22px;border:1px solid rgba(201,177,130,.22);outline:1px solid rgba(201,177,130,.1);outline-offset:6px;border-radius:2px}
</style></head><body>
